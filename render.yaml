# Render Blueprint (M13) — describes the intended production topology so
# setup is reproducible from this file rather than re-derived by hand in the
# dashboard. This file does NOT create anything by itself: nothing is
# provisioned until you apply it as a Blueprint in the Render dashboard
# (New → Blueprint, point at this repo). See docs/deployment/render.md for
# the full manual walkthrough and everything this file cannot express
# (Cloudflare R2 bucket/token, Paystack, Resend, Google OAuth).
#
# Secrets are never stored here. Every `sync: false` variable must be
# entered once in the Render dashboard after the Blueprint is created —
# Render will prompt for each one during setup.
#
# `plan: starter` below is a placeholder — pick whatever tier fits actual
# load; it just needs to be a PAID plan, since `preDeployCommand` and Cron
# Jobs both require one (see docs/deployment/render.md).
#
# All four services below carry the SAME full env var list, even the three
# narrow job scripts that don't touch every feature. This is deliberate:
# lib/env.ts validates its whole schema — including fail-closed production
# guards for PAYMENT_PROVIDER and STORAGE_PROVIDER — at module import time,
# unconditionally, in every process that transitively imports it (which all
# four of these do). A partial env var set on a job service would make that
# job fail at startup even though it never touches payments/storage itself.

databases:
  - name: crownsourceglobal-db
    plan: starter
    postgresMajorVersion: "17"

services:
  - type: web
    name: crownsourceglobal
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    # Runs once per deploy, on a separate instance, before the new version
    # starts serving traffic — the correct place for `prisma migrate deploy`
    # (never in startCommand, which would race across instances/restarts).
    preDeployCommand: npm run prisma:migrate:deploy
    startCommand: npm run start
    envVars: &crownsource_env_vars
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crownsourceglobal-db
          property: connectionString
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PAYMENT_PROVIDER
        value: paystack
      - key: PAYSTACK_ENV
        value: live
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: VENDOR_PAYOUT_HOLD_HOURS
        value: "72"

  # Three DB-backed jobs (CLAUDE.md §33.1/§18 — no message broker). Each is
  # the existing npm script, unchanged; Render just runs it on a schedule.
  # All schedules are UTC. See docs/deployment/render.md for the reasoning
  # behind each frequency, and the note above for why the full env list is
  # repeated here rather than trimmed to what each script actually uses.
  - type: cron
    name: crownsourceglobal-jobs-email
    runtime: node
    plan: starter
    schedule: "*/2 * * * *"
    buildCommand: npm ci
    startCommand: npm run jobs:email
    envVars: *crownsource_env_vars

  - type: cron
    name: crownsourceglobal-jobs-sweep-payments
    runtime: node
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: npm ci
    startCommand: npm run jobs:sweep-payments
    envVars: *crownsource_env_vars

  - type: cron
    name: crownsourceglobal-jobs-sweep-earnings
    runtime: node
    plan: starter
    # Coarse on purpose — this only advances a hold-period timer, never
    # time-sensitive to the minute (docs/workflows/workflows.md Workflow J).
    schedule: "0 * * * *"
    buildCommand: npm ci
    startCommand: npm run jobs:sweep-earnings
    envVars: *crownsource_env_vars
